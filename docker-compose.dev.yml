version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geonet}
      MYSQL_USER: ${MYSQL_USER:-geonet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-G3onet_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-G3onet_pass_root}

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql

    # Port not published to host for better security; api service can access mysql via Docker network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api

    command: npm run dev

    volumes:
      - .:/app

    ports:
      - "3000:3000"

    env_file:
      - .env.development

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
